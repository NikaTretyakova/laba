
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: ./.env
    environment:
      DB_HOST: db
      DB_NAME: db      
      DB_USER: admin   
      DB_PASSWORD: qwerty  
      DB_PORT: 5432
    ports:
      - "80:80"  
    volumes:
      - ./:/app 
      - /app/node_modules  
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true